name: Gerar animacao de contribuicoes

on:
  schedule:
    # todo dia as 03:00 e as 15:00 UTC (00:00 e 12:00 em Brasilia)
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    name: Gera e publica os SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Gera a cobrinha nas versoes clara e escura
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publica no branch output
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
