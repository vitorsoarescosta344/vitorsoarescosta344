<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Victor Soares, Backend e Plataforma">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="45%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#A371F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#21262D"/>
    </pattern>

    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="298" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0D1117"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <ellipse cx="1010" cy="150" rx="330" ry="230" fill="url(#glow)">
      <animate attributeName="rx" values="330;360;330" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- barra de acento superior -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- marca d'agua: chaves -->
    <text x="1046" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="200" font-weight="700" fill="#161B22" text-anchor="middle">&lt;/&gt;</text>

    <!-- prompt -->
    <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B949E">
      <tspan fill="#3FB950">victor@plataforma</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$ whoami</tspan>
    </text>
    <rect x="398" y="88" width="11" height="21" fill="#58A6FF">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- nome -->
    <text x="62" y="176" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="60" font-weight="800" fill="#E6EDF3" letter-spacing="-1.5">Victor Soares</text>

    <!-- papel -->
    <text x="64" y="216" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="23" font-weight="600" fill="#58A6FF">Backend &amp; Plataforma</text>
    <text x="322" y="216" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="23" font-weight="400" fill="#8B949E">·&#160; APIs, dados e infraestrutura</text>

    <!-- stack -->
    <text x="64" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6E7681"
          letter-spacing="0.5">TypeScript &#160;·&#160; .NET &#160;·&#160; Go &#160;·&#160; Bun &#160;·&#160; PostgreSQL &#160;·&#160; Docker &#160;·&#160; Linux</text>

    <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#21262D" stroke-width="2"/>
  </g>
</svg>
